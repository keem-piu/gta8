    <style>
        :root {
            --primary: #53fc18;
            --primary-dark: #2b8a0e;
            --background: #18181c;
            --card-bg: #23232b;
            --text: #f5f5f7;
            --text-secondary: #b0b0b8;
            --live-red: #ff3b3b;
            --sponsor-gold: #ffe066;
            --category-bg: #23232b;
            --category-text: #53fc18;
            --card-shadow: 0 6px 32px 0 rgba(0,0,0,0.18);
            --card-hover-shadow: 0 12px 32px 0 rgba(83,252,24,0.10);
            --border-radius: 22px;
        }

        html, body {
            height: 100%;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #18181c 0%, #23232b 100%);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            letter-spacing: 0.01em;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 16px 16px 16px;
        }

        header {
            background: transparent;
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            color: var(--primary);
            font-size: 2.3rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        #search-form {
            position: relative;
            margin-top: 18px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #53fc18;
            pointer-events: none;
            z-index: 2;
        }
        .search-bar {
            width: 100%;
            max-width: 400px;
            padding: 14px 20px 14px 44px; /* Soldan boşluk artırıldı */
            border-radius: 14px;
            border: none;
            background: #23232b;
            color: var(--text);
            font-size: 1.08rem;
            margin: 0 auto;
            display: block;
            outline: none;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.10);
            transition: box-shadow 0.2s, border 0.2s;
        }
        .search-bar:focus {
            box-shadow: 0 4px 16px 0 rgba(83,252,24,0.12);
            border: 1.5px solid var(--primary);
        }

        .streamer-list {
            display: grid;
            grid-template-columns: repeat(3, 500px); /* 3 kanal, her biri 500px */
            justify-content: center;
            gap: 32px;
            margin-top: 32px;
        }

        .streamer-card {
            width: 500px;
            min-width: 0;
            max-width: 100%;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            transition: box-shadow 0.25s, transform 0.18s;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: none;
            position: relative;
        }
        .streamer-card:hover {
            box-shadow: var(--card-hover-shadow);
            transform: translateY(-6px) scale(1.02);
        }
        .streamer-card.live {
            border: 2px solid var(--live-red);
        }
        .streamer-card.sponsored {
            border: 2px solid var(--sponsor-gold);
            box-shadow: 0 0 24px 0 rgba(255, 224, 102, 0.18);
        }

        .streamer-media {
            width: 100%;
            aspect-ratio: 16/9;
            background: #19191e;
            position: relative;
        }
        .streamer-iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
            display: block;
        }
        .offline-placeholder {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 1rem;
            gap: 12px;
            background: rgba(0,0,0,0.55);
        }
        .profile-image {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--text-secondary);
        }
        .offline-status {
            background: rgba(0,0,0,0.7);
            padding: 6px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .streamer-info {
            padding: 22px 20px 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex-grow: 1;
        }
        .streamer-header {
            display: flex;
            align-items: center;
            gap: 18px;
            /* align-items: center; Zaten var, tekrar eklemeye gerek yok */
        }
        .avatar-wrapper,
        .streamer-header > div[style*="inline-block"] {
            position: relative;
            display: flex !important;
            align-items: center;
            justify-content: center;
            width: 62px;
            height: 62px;
            min-width: 62px;
            min-height: 62px;
            /* Daire oranı için */
            border-radius: 50%;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .streamer-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .favorite-btn {
            position: absolute !important;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex !important;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            background: none;
            z-index: 2;
            border-radius: 50%;
            box-sizing: border-box;
            /* Parlaklık ve efektler zaten mevcut */
        }

        .streamer-name-container {
            flex-grow: 1;
            min-width: 0;
        }
        .streamer-name {
            font-weight: 700;
            font-size: 1.18rem;
            color: var(--primary);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: color 0.18s;
        }
        .streamer-name:hover {
            color: #fff;
        }
        .streamer-title {
            font-size: 1.01rem;
            color: var(--text-secondary);
            margin-top: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        .streamer-meta {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;      /* Ortala */
            gap: 18px;                   /* Aralar biraz açıldı */
            margin-top: 24px;
            width: 100%;
            font-size: 1.08rem;
            flex-wrap: nowrap;           /* Alt satıra taşmasın */
            overflow: hidden;            /* Taşanları gizle */
        }
        .streamer-category,
        .viewer-count,
        .live-duration {
            flex: 1 1 0;
            min-width: 0;
            max-width: 180px;            /* Gerekirse artırabilirsin */
            padding: 7px 10px;
            font-size: 1.08rem;
            border-radius: 8px;
            white-space: nowrap;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;     /* İçeriği ortala */
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0 2px;
        }

        .streamer-category {
            background: var(--category-bg);
            color: var(--category-text);
            font-weight: 700;
            border: 1.5px solid var(--primary);
            max-width: 100%;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
            text-align: center;
            text-decoration: none; /* Altı çizgiyi kaldırır */
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .viewer-count {
            background: rgba(255, 59, 59, 0.13);
            color: var(--live-red);
            font-weight: 700;
            gap: 6px;
        }

        .viewer-icon {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 4px;
            flex-shrink: 0;
        }

        .live-duration {
            background: rgba(83, 252, 24, 0.09);
            color: var(--primary);
            font-family: monospace;
            font-weight: 700;
            gap: 6px;
        }
        .clock-icon {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 4px;
            flex-shrink: 0;
        }
        .live-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            background: var(--live-red);
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px 0 rgba(255,59,59,0.10);
        }
        .live-pulse {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.7; }
            100% { transform: scale(0.95); opacity: 1; }
        }
        .streamer-tag {
            position: absolute;
            bottom: 14px;
            left: 14px;
            background: rgba(0,0,0,0.7);
            color: var(--primary);
            padding: 5px 14px;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 600;
        }
        .sponsored-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            background: var(--sponsor-gold);
            color: #23232b;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px 0 rgba(255,224,102,0.10);
        }
        .last-updated {
            text-align: center;
            margin-top: 36px;
            color: var(--text-secondary);
            font-size: 0.97rem;
        }
        .refresh-button {
            background: #23232b;
            color: var(--primary);
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 28px;
            transition: all 0.2s;
            font-weight: 700;
            font-size: 1.01rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 8px 0 rgba(0,0,0,0.10);
        }
        .refresh-button:hover {
            background: var(--primary);
            color: #23232b;
            transform: translateY(-2px) scale(1.03);
        }
        .loading {
            text-align: center;
            padding: 36px;
            color: var(--primary);
            font-size: 1.1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .loading-spinner {
            width: 60px;
            height: 60px;
            position: relative;
        }
        .solar-clock {
            width: 100%;
            height: 100%;
            animation: rotate 2s linear infinite;
            transform-origin: center;
        }
        .solar-clock-circle {
            fill: none;
            stroke: var(--primary);
            stroke-width: 4;
            stroke-dasharray: 150;
            stroke-dashoffset: 150;
            animation: dash 1.5s ease-in-out infinite;
        }
        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }
        @keyframes dash {
            0% { stroke-dashoffset: 150; stroke: var(--primary);}
            50% { stroke-dashoffset: 50; stroke: var(--primary-dark);}
            100% { stroke-dashoffset: 150; stroke: var(--primary);}
        }
        .error-message {
            color: #ff5555;
            text-align: center;
            padding: 18px;
            background: rgba(255, 85, 85, 0.10);
            border-radius: 10px;
            margin: 18px 0;
            border: 1.5px solid rgba(255, 85, 85, 0.18);
        }
        @media (max-width: 900px) {
            .streamer-list {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 600px) {
            .container {
                padding: 10px 2vw;
            }
            .streamer-list {
                grid-template-columns: 1fr;
                gap: 18px;
            }
            .streamer-info {
                padding: 14px 8px 12px 8px;
            }
            .streamer-header {
                gap: 10px;
            }
        }
        /* Responsive düzeltme */
        @media (max-width: 1600px) {
            .streamer-list {
                grid-template-columns: repeat(2, 1fr);
            }
            .streamer-card {
                width: 100%;
            }
        }
        @media (max-width: 1100px) {
            .streamer-list {
                grid-template-columns: 1fr;
            }
        }

        /* Sponsor kullanıcı adı için animasyonlu degrade renk efekti */
.streamer-card.sponsored .streamer-name {
    background: linear-gradient(90deg, #53fc18, #00e0ff, #53fc18, #ffe066, #53fc18);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: sponsor-gradient-move 2.5s linear infinite;
    font-weight: 800;
    letter-spacing: 1.5px;
}

@keyframes sponsor-gradient-move {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

/* Sponsor kartındaki profil resmi ve çevrimdışı resmi için animasyonlu degrade çerçeve */
.streamer-card.sponsored .streamer-avatar,
.streamer-card.sponsored .profile-image {
    position: relative;
    z-index: 1;
    border: 3px solid transparent;
    background: linear-gradient(120deg, #53fc18, #00e0ff, #53fc18, #ffe066, #53fc18);
    background-size: 300% 300%;
    animation: sponsor-avatar-gradient-move 2.5s linear infinite;
    /* Görselin degrade görünmesi için aşağıdaki satırlar gerekli */
    -webkit-background-clip: border-box;
    background-clip: border-box;
    border-radius: 50%;
    box-shadow: 0 0 0 4px transparent, 0 0 16px 2px rgba(83,252,24,0.18);
}

@keyframes sponsor-avatar-gradient-move {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

.favorite-btn {
    box-shadow: 0 0 0 3px #53fc18, 0 2px 8px 0 rgba(83,252,24,0.18);
    border-radius: 50%;
    transition: box-shadow 0.2s, transform 0.15s;
    opacity: 0.93;
    outline: 2px solid #23232b;
}
.favorite-btn:hover {
    box-shadow: 0 0 0 5px #53fc18, 0 4px 16px 0 rgba(83,252,24,0.25);
    transform: scale(1.08);
    opacity: 1;
    outline: 2.5px solid #53fc18;
}
.favorite-btn svg {
    filter: drop-shadow(0 0 4px #53fc18);
}

/* .avatar-wrapper ve .favorite-btn için ekleyin veya güncelleyin */

.avatar-wrapper {
    position: relative;
    display: flex !important;
    align-items: center;
    justify-content: center;
    width: 62px;
    height: 62px;
    min-width: 62px;
    min-height: 62px;
    border-radius: 50%;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

.favorite-btn {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s;
}

.avatar-wrapper:hover .favorite-btn,
.avatar-wrapper:focus-within .favorite-btn {
    opacity: 1;
    pointer-events: auto;
}

        .toolbar {display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px;}
        .filter-bar {display:flex;gap:7px;flex-wrap:wrap;}
        .filter-chip {border:1px solid #3b5448;background:#202923;color:#dcebe0;border-radius:9px;padding:10px 13px;cursor:pointer;}
        .filter-chip.active {background:#53fc18;color:#102017;border-color:#53fc18;font-weight:700;}
        .sort-control {display:flex;align-items:center;gap:8px;color:#bac9bc;font-size:.88rem;}
        .sort-control select {padding:9px;color:#edf9ed;background:#26302b;border:1px solid #385044;border-radius:9px;}
        .data-status {color:#bacbbc;background:#1c2722;border:1px solid #314b3c;padding:12px 14px;border-radius:11px;margin-top:16px;font-size:.9rem;line-height:1.5;}
        .empty-message {text-align:center;padding:35px;color:#cbd5c9;}
        .favorite-btn {border-radius:10px; width:40px;height:38px;position:static!important;flex:none;background:#2e3a32;color:#fff;box-shadow:none;outline:0;opacity:1;border:1px solid #405347;font-size:1.3rem;cursor:pointer; pointer-events:auto!important; opacity:1!important;}
        .favorite-btn[aria-pressed="true"] {color:#ffe066;}
        .streamer-header {gap:10px;}
        .streamer-header .streamer-avatar {height:50px;width:50px;}
        .avatar-wrapper {min-width:54px;width:54px;min-height:54px;height:54px;}
        .auto-controls {margin:15px 0 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
          color:#d8eddb;font-size:.88rem;background:#18251f;border:1px solid #345447;padding:12px 14px;border-radius:10px;}
        .auto-controls label {display:flex;align-items:center;gap:6px;cursor:pointer;}
        .auto-controls input {accent-color:#53fc18;width:16px;height:16px;}
        #autoplay-status {margin-left:auto;color:#9bb6a6;}
        .media-overlay[hidden]{display:none!important;}
        .loading {padding:16px;}
        .loading[hidden], [hidden] {display:none!important;}
        @media(max-width:1100px){.streamer-list {grid-template-columns:repeat(2,minmax(0,1fr));}}
        @media(max-width:680px){.streamer-list {grid-template-columns:minmax(0,1fr);gap:14px;} .container{padding:16px 12px;}h1{font-size:1.55rem;}.streamer-card:hover{transform:none;}}
        @media(prefers-reduced-motion:reduce){.streamer-card,.favorite-btn{transition:none!important;transform:none!important;}}
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Kick.com GTA Canlı Yayınları</h1>
            <form id="search-form"  style="margin-top:20px; position:relative; max-width:400px; margin-left:auto; margin-right:auto;">
                <span class="search-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="1.5" d="m21 21l-4-4m2-6a8 8 0 1 1-16 0a8 8 0 0 1 16 0"></path>
                    </svg>
                </span>
                <input type="text" id="search-input" class="search-bar" placeholder="Kanal ara...">
            </form>
        </div>
    </header>

    <div class="container">
        <div id="error-message" class="error-message" style="display: none;"></div>

        <div class="toolbar" role="group" aria-label="Yayıncı filtreleri">
            <div class="filter-bar">
              <button type="button" class="filter-chip active" data-filter="all">Tümü</button>
              <button type="button" class="filter-chip" data-filter="live">🔴 Canlı</button>
              <button type="button" class="filter-chip" data-filter="offline">Çevrimdışı</button>
              <button type="button" class="filter-chip" data-filter="favorites">★ Favoriler</button>
            </div>
            <label class="sort-control">Sırala <select id="sort-select"><option value="default">Canlı ve favoriler</option><option value="viewers">İzleyici sayısı</option><option value="name">İsim</option><option value="recent">Son yayın tarihi</option></select></label>
        </div>
        <div class="auto-controls" aria-label="Otomatik yayın oynatma">
          <label><input id="autoplay-toggle" type="checkbox" checked> Görünen canlı yayınları otomatik oynat (sessiz)</label>
          <label><input id="unknown-toggle" type="checkbox" checked> Durumu bilinmeyen kanalları da dene</label>
          <span id="autoplay-status" role="status">Oynatıcılar hazırlanıyor</span>
        </div>
        <div id="data-status" class="data-status" role="status" aria-live="polite">Yayıncı listesi hazırlanıyor...</div>
        <div id="streamer-list" class="streamer-list"></div>
        <p id="empty-message" class="empty-message" hidden>Bu aramaya uygun kanal yok.</p>

        <!-- Yükleniyor bölümü kartların altına taşındı -->
        <div id="loading" class="loading">
            <div class="loading-spinner">
                <svg class="solar-clock" viewBox="0 0 50 50">
                    <circle class="solar-clock-circle" cx="25" cy="25" r="20"></circle>
                </svg>
            </div>
            <div>Yayınlar hızla yükleniyor...</div>
        </div>

        <div class="last-updated">
            Son doğrulama: <span id="update-time">Henüz yok</span>
        </div>

        <center>
            <button class="refresh-button" id="refresh-button" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4C7.58 4 4 7.58 4 12C4 16.42 7.58 20 12 20C15.73 20 18.84 17.45 19.73 14H17.65C16.83 16.33 14.61 18 12 18C8.69 18 6 15.31 6 12C6 8.69 8.69 6 12 6C13.66 6 15.14 6.69 16.22 7.78L13 11H20V4L17.65 6.35Z" fill="currentColor"/>
                </svg>
                Yenile
            </button>
        </center>
    </div>

    <script src="./app.js" defer></script>
</body>
</html>
